server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"kyros-system"}\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
