<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kyros System | Deployment Smoke Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(1.75rem, 5vw, 3.5rem);
        border: 1px solid #263244;
        border-radius: 1.25rem;
        background: linear-gradient(145deg, #172033, #101722);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.3);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #87d5b5;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: -0.055em; }

      p { max-width: 35rem; margin: 1rem 0 0; color: #b9c5d8; line-height: 1.65; }

      .marker {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 2rem;
        padding: 0.65rem 0.85rem;
        border: 1px solid #2d815f;
        border-radius: 999px;
        color: #a8f0cc;
        background: rgba(45, 129, 95, 0.16);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9rem;
      }

      .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #7bf0b1; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Kyros System</p>
      <h1>Deployment smoke test</h1>
      <p>The site is online and ready for the next release.</p>
      <div class="marker"><span class="dot"></span>release: smoke-001</div>
    </main>
  </body>
</html>
